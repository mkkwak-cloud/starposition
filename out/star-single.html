<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>별자리 하늘</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#050a18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="별자리">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#050a18;--panel:rgba(10,18,40,.82);--line:#27406e;--text:#e6eeff;--dim:#8ea3c9;--accent:#7fd6ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Pretendard,"Malgun Gothic",system-ui,sans-serif;overflow:hidden;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.bar{position:fixed;left:0;right:0;top:0;padding:max(8px,env(safe-area-inset-top)) 10px 10px;background:linear-gradient(var(--panel) 70%,transparent);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bar h1{font-size:16px;margin:0 4px 0 0;white-space:nowrap}
button,select{font:inherit;font-size:13px;color:var(--text);background:rgba(30,50,95,.8);border:1px solid var(--line);border-radius:999px;padding:6px 11px;white-space:nowrap}
#v{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.panel{z-index:5;position:fixed;left:0;right:0;bottom:0;max-height:62vh;overflow:auto;background:rgba(8,16,36,.96);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:14px 16px max(16px,env(safe-area-inset-bottom));display:none;touch-action:pan-y}
.panel h2{margin:0 36px 2px 0;font-size:20px}
.panel .sub{color:var(--dim);font-size:13px;margin-bottom:8px}
.panel table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
.panel td{padding:5px 0;border-bottom:1px solid #1b2c52;vertical-align:top}
.panel td:first-child{color:var(--dim);width:92px;white-space:nowrap}
.panel p{margin:8px 0 0;line-height:1.55;font-size:14px}
.panel .x{position:absolute;right:10px;top:10px;padding:4px 11px;font-size:16px}
.hint{position:fixed;left:12px;right:12px;top:96px;font-size:13px;color:#ffd9a6;text-shadow:0 0 4px #000;pointer-events:none}
button.on{background:var(--accent);color:#04101f;border-color:var(--accent)}
.info{position:fixed;left:0;right:0;bottom:0;padding:18px 12px max(12px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--panel) 35%);font-size:14px;overflow:hidden}
.info .row{display:flex;gap:10px;align-items:center;margin-top:6px;min-width:0}
.info input[type=range]{flex:1;min-width:0;width:100%}
#when{white-space:nowrap}
.dim{color:var(--dim);font-size:13px}
#when{font-weight:600}
/* 가로로 돌려 화면 높이가 낮을 때: 설명을 숨기고 슬라이더를 나란히 놓아 하늘을 덜 가림 */
@media (max-height:500px){
  .help,.bar h1{display:none}
  .bar{padding-bottom:4px}
  .info{display:flex;flex-wrap:wrap;column-gap:14px;padding-top:8px;padding-bottom:max(6px,env(safe-area-inset-bottom))}
  .info>*{flex:1 1 100%}
  .info .row{flex:1 1 260px;margin-top:0}
  #where{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
}
</style>
</head>
<body>
<video id="v" playsinline autoplay muted></video>
<canvas id="c"></canvas>
<div id="hint" class="hint"></div>
<div id="panel" class="panel"><button class="x" id="pClose">✕</button><div id="pBody"></div></div>
<div class="bar">
  <h1>★ 별자리 하늘</h1>
  <button id="bGps">내 위치</button>
  <button id="bLines" class="on">별자리 선</button>
  <button id="bNames" class="on">이름</button>
  <button id="bNow">지금</button>
  <button id="bCam">카메라</button>
  <button id="bBg" style="display:none">검정 바탕</button>
  <button id="bFull">전체화면</button>
  <button id="bFit" style="display:none">십자에 맞추기</button>
  <button id="bReset" style="display:none">보정 초기화</button>
  <button id="bInst" style="display:none">앱 설치</button>
</div>
<div class="info">
  <div id="where" class="dim"></div>
  <div class="row"><span id="when"></span><input id="sl" type="range" min="-720" max="720" step="5" value="0"></div>
  <div class="row"><span class="dim" style="white-space:nowrap">화면 넓이 <b id="fovT"></b></span><input id="fovSl" type="range" min="20" max="160" step="1"></div>
  <div class="dim help">화면을 끌면 시선이 움직이고, 두 손가락(또는 휠)으로 확대·축소. 슬라이더는 지금부터 ±12시간. 카메라를 켠 뒤 화면을 끌면 방향이 어긋난 만큼 보정됩니다.</div>
</div>

// ---- 글자 겹침 방지 ----
const taken = [];
function tryText(txt, x, y, align, force) {
  const w = g.measureText(txt).width, x0 = align === 'center' ? x - w / 2 : x, r = [x0 - 2, y - 14, x0 + w + 2, y + 4];
  if (!force && taken.some(t => r[0] < t[2] && r[2] > t[0] && r[1] < t[3] && r[3] > t[1])) return false;
  taken.push(r);
  g.save(); g.textAlign = align; g.shadowColor = '#000'; g.shadowBlur = 4; g.fillText(txt, x, y); g.restore();
  return true;
}

// ---- 해·달·행성 (astronomy-engine 으로 계산) ----
const BODIES = [['Sun','태양','#ffd34d'],['Moon','달','#f2f2f2'],['Mercury','수성','#c9b79c'],['Venus','금성','#fff2c0'],
  ['Mars','화성','#ff7a54'],['Jupiter','목성','#ffd9a0'],['Saturn','토성','#e8d28a'],['Uranus','천왕성','#9fe8ee'],['Neptune','해왕성','#7da2ff']];

  const obs = new Astronomy.Observer(S.lat, S.lon, 0);

  for (const [id, ko, col] of BODIES) {
    const eq = Astronomy.Equator(id, date, obs, false, true); // J2000 기준: 별 자료와 같은 기준
    const q = P(eq.ra * 15, eq.dec, L);

    if (x < -30 || x > W + 30 || y < -30 || y > H + 30) continue;
    bodyHits.push({ id, ko, x, y });

      const gr = g.createRadialGradient(x, y, 0, x, y, 40); gr.addColorStop(0, 'rgba(255,210,80,.9)'); gr.addColorStop(1, 'rgba(255,210,80,0)');

    rows.push(['뜨는 시각', timeText(Astronomy.SearchRiseSet(id, obs, +1, date, 2), date)]);
    rows.push(['지는 시각', timeText(Astronomy.SearchRiseSet(id, obs, -1, date, 2), date)]);
    return { title: info.en, sub: id === 'Sun' ? '항성' : id === 'Moon' ? '지구의 위성' : '행성', rows, text: info.text };
  }
  if (sel.t === 'star') {
    const [ra, dec, mag, bv, cid, bayer] = SKY.stars[sel.i], nm = namedMap.get(sel.i), c = conById[cid], h = horiz(ra, dec, L);
    const title = nm ? nm[0] : bayer && c ? bayer + ' ' + c.en : '이름 없는 별';
    rows.push(['지금 위치', whereText(h)]);
    rows.push(['밝기', mag.toFixed(1) + '등급 · ' + magWord(mag)]);
    rows.push(['색', colorWord(bv)]);
    if (c) rows.push(['별자리', c.ko]);
    return { title, sub: nm && nm[1] && nm[1] !== nm[0] ? nm[1] : '별', rows, text: '' };
  }
  const c = sel.c, h = horiz(c.ra, c.dec, L), maxAlt = 90 - Math.abs(S.lat - c.dec);
  rows.push(['지금 위치', whereText(h)]);
  rows.push(['한국에서', maxAlt <= 0 ? '이 위치에서는 볼 수 없음' : c.dec > 90 - S.lat ? '일 년 내내 지평선 위에 있음' : maxAlt < 20 ? '지평선 가까이 낮게만 보임' : '계절에 따라 뜨고 짐']);
  if (maxAlt > 0) rows.push(['잘 보이는 때', bestMonth(c.ra)]);
  if (c.top.length) rows.push(['밝은 별', c.top.map(([n, m]) => `${n}(${m.toFixed(1)}등급)`).join(', ')]);
  return { title: c.ko, sub: c.en + ' · 별자리', rows, text: CON_INFO[c.id] || '' };
}
function renderPanel(date, L) {
  lastPanel = Date.now();
  date = date || now(); if (L === undefined) L = lst(date);
  const d = describe(date, L);
  $('pBody').innerHTML = `<h2>${esc(d.title)}</h2><div class="sub">${esc(d.sub)}</div><table>${d.rows.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</table>${d.text ? '<p>' + esc(d.text) + '</p>' : ''}`;
  $('panel').style.display = 'block';
}
function selHoriz(date, L) { // 눌러 둔 천체의 지금 [고도, 방위]
  if (sel.t === 'body') { const eq = Astronomy.Equator(sel.id, date, new Astronomy.Observer(S.lat, S.lon, 0), false, true); return horiz(eq.ra * 15, eq.dec, L); }
  if (sel.t === 'star') { const q = SKY.stars[sel.i]; return horiz(q[0], q[1], L); }
  return horiz(sel.c.ra, sel.c.dec, L);
}
function fitToCross() { // 폰 십자를 실제 천체에 맞춘 상태에서 누름 → 화면의 그 천체가 십자 자리로 옴
  if (!sv || !sel) return;
  const date = now(), h = selHoriz(date, lst(date)), [alt, az] = rawView();
  S.offAz = ((h[1] - az + 540) % 360) - 180; S.offAlt = h[0] - alt;
  $('bReset').style.display = ''; saveCal(); closePanel(); applyOrientation0();
  hint('맞췄습니다. 이 폰에 저장되어 다음에도 적용됩니다.'); setTimeout(() => hint(''), 4000);
}
function closePanel() { sel = null; $('panel').style.display = 'none'; draw(); }
function drawSel() {
  $('bFit').style.display = sv && sel ? '' : 'none';
  if (!sel) return;
  let p = null;
  if (sel.t === 'body') { const b = bodyHits.find(b => b.id === sel.id); if (b) p = [b.x, b.y]; }
  else if (sel.t === 'star') p = starPos[sel.i] && starPos[sel.i].p;
  if (p) { g.strokeStyle = '#ffe07a'; g.lineWidth = 2; g.beginPath(); g.arc(p[0], p[1], 17, 0, 6.283); g.stroke(); }
}
function segDist(px, py, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - a[0]) * dx + (py - a[1]) * dy) / l2 : 0; t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - a[0] - t * dx, py - a[1] - t * dy);
}
function tapAt(x, y) {
  const L = lst(now());
  let best = null, bd = 34;
  for (const b of bodyHits) { const d = Math.hypot(b.x - x, b.y - y); if (d < bd) { bd = d; best = { t: 'body', id: b.id }; } }
  if (!best && S.names) { // 별자리 이름 글자를 누른 경우
    for (const c of SKY.cons) {
      const q = P(c.ra, c.dec, L);
      if (q.p && Math.abs(q.p[0] - x) < 6 + c.ko.length * 8 && Math.abs(q.p[1] - y - 5) < 14) { best = { t: 'con', c }; break; }
    }
  }
  if (!best) {
    bd = 1e9;
    for (let i = 0; i < SKY.stars.length; i++) {
      const q = starPos[i], m = SKY.stars[i][2]; if (!q || !q.p || m > 5) continue;
      const d = Math.hypot(q.p[0] - x, q.p[1] - y); if (d > 22) continue;
      const score = d + m * 2.5 - (namedMap.has(i) ? 8 : 0);
      if (score < bd) { bd = score; best = { t: 'star', i }; }
    }
  }
  if (!best) {
    bd = 26;
    for (const c of SKY.cons) {
      const q = P(c.ra, c.dec, L);
      if (q.p) { const d = Math.hypot(q.p[0] - x, q.p[1] - y) - 14; if (d < bd) { bd = d; best = { t: 'con', c }; } }
      for (const seg of c.lines) {
        let prev = null;
        for (const [ra, dec] of seg) { const p = P(ra, dec, L).p; if (p && prev) { const d = segDist(x, y, prev, p); if (d < bd) { bd = d; best = { t: 'con', c }; } } prev = p; }
      }
    }
  }
  if (!best) { if (sel) closePanel(); return; }
  sel = best; renderPanel(); draw();
}

// ---- 화면 크기·조작 ----
function resize() { dpr = devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; draw(); }
addEventListener('resize', resize);
const ptrs = new Map(); let pinch = 0;
let calDirty = false;
let tap = null;   // 짧게 눌렀다 떼면 '누르기', 움직였으면 '끌기'
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); pinch = 0; tap = ptrs.size === 1 ? { x: e.clientX, y: e.clientY, t: Date.now() } : null; });
cv.addEventListener('pointerup', e => {
  if (tap && ptrs.size === 1 && Date.now() - tap.t < 600 && Math.hypot(e.clientX - tap.x, e.clientY - tap.y) < 10) tapAt(e.clientX, e.clientY);
  tap = null; ptrs.delete(e.pointerId);
  if (calDirty) { calDirty = false; saveCal(); }
});
cv.addEventListener('pointercancel', e => ptrs.delete(e.pointerId));
cv.addEventListener('pointermove', e => {
  const old = ptrs.get(e.pointerId); if (!old) return;
  const cur = [e.clientX, e.clientY]; ptrs.set(e.pointerId, cur);
  if (ptrs.size === 1 && sv) { // 센서가 켜져 있으면 끌기 = 어긋남 보정
    const degPerPx = S.fov / H;
    S.offAz -= (cur[0] - old[0]) * degPerPx; S.offAlt += (cur[1] - old[1]) * degPerPx;
    $('bReset').style.display = ''; applyOrientation0(); calDirty = true;
  } else if (ptrs.size === 1) {
    const degPerPx = S.fov / H;
    S.az = ((S.az - (cur[0] - old[0]) * degPerPx) % 360 + 360) % 360;
    S.alt = Math.max(-90, Math.min(90, S.alt + (cur[1] - old[1]) * degPerPx));
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (pinch) setFov(S.fov * pinch / d); if (S.cam) calDirty = true;
    pinch = d;
  }
  draw();
});
cv.addEventListener('wheel', e => { e.preventDefault(); setFov(S.fov * (e.deltaY > 0 ? 1.1 : 0.9)); if (S.cam) saveCal(); draw(); }, { passive: false });

$('bLines').onclick = e => { S.lines = !S.lines; e.target.classList.toggle('on', S.lines); draw(); };
$('bNames').onclick = e => { S.names = !S.names; e.target.classList.toggle('on', S.names); draw(); };
$('fovSl').oninput = e => { setFov(+e.target.value); if (S.cam) saveCal(); draw(); };
$('sl').oninput = e => { S.offMin = +e.target.value; draw(); };
$('pClose').onclick = closePanel;
$('bFit').onclick = fitToCross;
$('bBg').onclick = () => { bgBlack = !bgBlack; try { localStorage.setItem('starbg', bgBlack ? 'black' : 'video'); } catch (e) { } showBg(); draw(); };
// 전체화면: 이미 앱처럼 열렸으면 숨김 / 지원하면 전환 / 아이폰은 설치 방법 안내
const isApp = matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const de = document.documentElement, canFull = !!(de.requestFullscreen || de.webkitRequestFullscreen);
if (isApp) $('bFull').style.display = 'none';
else if (!canFull) $('bFull').textContent = '앱처럼 쓰기';
$('bFull').onclick = () => {
  if (!canFull) { hint('아이폰: 아래 공유 버튼 → "홈 화면에 추가"를 하고, 홈 화면의 별자리 아이콘으로 열면 주소창 없이 꽉 찬 화면이 됩니다.'); setTimeout(() => hint(''), 9000); return; }
  if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (de.requestFullscreen || de.webkitRequestFullscreen).call(de).catch(() => hint('전체화면을 켜지 못했습니다. 브라우저 메뉴의 "홈 화면에 추가"를 이용해 주세요.'));
};
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => { const on = document.fullscreenElement || document.webkitFullscreenElement; $('bFull').textContent = on ? '전체화면 끄기' : '전체화면'; $('bFull').classList.toggle('on', !!on); }));
$('bCam').onclick = () => S.cam ? camOff() : camOn();
$('bReset').onclick = e => { S.offAz = S.offAlt = 0; e.target.style.display = 'none'; saveCal(); if (sv) applyOrientation0(); };
$('bNow').onclick = () => { S.offMin = 0; $('sl').value = 0; draw(); };
function getGps(silent) { // silent: 열 때 자동 호출(실패해도 조용히 기존 위치 유지)
  if (!navigator.geolocation) { if (!silent) alert('이 브라우저는 위치 기능이 없습니다.'); return; }
  navigator.geolocation.getCurrentPosition(p => {
    S.lat = p.coords.latitude; S.lon = p.coords.longitude; S.place = '내 위치'; draw();
    try { localStorage.setItem('starloc', JSON.stringify([S.lat, S.lon])); } catch (e) { }
  }, () => { if (!silent) alert('위치를 가져오지 못했습니다. 위치 허용을 확인해 주세요.'); }, { enableHighAccuracy: true, timeout: 10000, maximumAge: silent ? 600000 : 0 });
}
$('bGps').onclick = () => getGps(false);
// 마지막으로 가져온 위치를 먼저 쓰고, 터치 폰에서 그냥 열면 새 위치를 자동으로 가져옴
try { const l = JSON.parse(localStorage.getItem('starloc') || 'null'); if (l && isFinite(l[0]) && isFinite(l[1]) && !location.hash) { S.lat = l[0]; S.lon = l[1]; S.place = '내 위치(저장값)'; } } catch (e) { }
if (navigator.maxTouchPoints > 0 && !location.hash) getGps(true);
setInterval(() => { if (!S.offMin) draw(); }, 30000);
const sim = /sim=([-\d.]+),([-\d.]+),([-\d.]+)/.exec(location.hash); // 확인용: 가짜 센서값
if (sim) { S.cam = false; setFov(62); applyOrientation(+sim[1], +sim[2], +sim[3]); }
if (savedCal) { S.offAz = savedCal.offAz || 0; S.offAlt = savedCal.offAlt || 0; if (savedCal.camFov >= 20 && savedCal.camFov <= 160) camFov = savedCal.camFov; if (S.offAz || S.offAlt) $('bReset').style.display = ''; }
setFov(S.fov);
resize();
// 앱 설치 버튼: 크롬이면 바로 설치창, 카톡·다른 앱 안이면 크롬으로 넘김, 그 외는 방법 안내
const SITE = 'https://mkkwak-cloud.github.io/starposition/';
let instPrompt = null;
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
const ua = navigator.userAgent, inKakao = /KAKAOTALK/i.test(ua), inOther = /NAVER\(inapp|Instagram|FBAN|FBAV|Line\//i.test(ua);
addEventListener('beforeinstallprompt', e => { e.preventDefault(); instPrompt = e; if (/install=1/.test(location.search) && !isApp) hint('위쪽 "앱 설치" 버튼을 누르면 설치창이 뜹니다. "설치"를 누르면 홈 화면에 바로가기가 생깁니다.'); });
addEventListener('appinstalled', () => { $('bInst').style.display = 'none'; hint('설치됐습니다. 홈 화면의 별자리 아이콘으로 열어 주세요.'); setTimeout(() => hint(''), 6000); });
if (navigator.maxTouchPoints > 0 && !isApp) {
  $('bInst').style.display = '';
  $('bInst').onclick = async () => {
    if (instPrompt) { instPrompt.prompt(); await instPrompt.userChoice; instPrompt = null; return; }
    if (inKakao) { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(SITE + '?install=1'); return; }
    if (inOther) { hint('이 앱 안에서는 설치가 안 됩니다. 메뉴에서 "다른 브라우저로 열기"를 눌러 크롬으로 열어 주세요.'); }
    else if (!/^https?:$/.test(location.protocol)) { location.href = SITE; return; }
    else if (/iphone|ipad|ipod/i.test(ua)) hint('아래 공유 버튼 → "홈 화면에 추가"를 눌러 주세요.');
    else hint('브라우저 메뉴(⋮) → "홈 화면에 추가" 또는 "앱 설치"를 눌러 주세요. (설치 창은 크롬에서 바로 뜹니다)');
    setTimeout(() => hint(''), 9000);
  };
}
// 폰(터치 기기)에서 그냥 열면 자동으로 카메라+센서를 켠다. 아이폰은 허용창 때문에 첫 터치가 필요.
if (navigator.maxTouchPoints > 0 && !location.hash) {
  if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
    hint('화면을 한 번 누르면 카메라와 방향센서가 켜집니다.');
    document.addEventListener('click', e => { if (!S.cam && !e.target.closest('#bCam')) camOn(); }, { once: true });
  } else camOn();
}
const tp = /tap=([-\d.]+),([-\d.]+)/.exec(location.hash); // 확인용: 그 자리를 누른 것처럼 동작
if (tp) try { tapAt(+tp[1], +tp[2]); } catch (e) { hint('오류: ' + e.message); }
</script>
